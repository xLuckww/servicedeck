<!doctype html>
<html lang="zh-CN">
<head>
<meta charset="utf-8">
<title>ServiceDeck 宣传片封面</title>
<link rel="stylesheet" href="stage.css">
<style>
  /* B 站封面：16:10，1920×1200。缩成小图也要能看清大字 */
  body { background: #05070a; }
  #cover { position: relative; width: 1920px; height: 1200px; overflow: hidden; background: var(--stage); }
  #cover .menubar { height: 66px; font-size: 30px; }
  #cover .mb-left { height: 66px; gap: 44px; left: 44px; }
  #cover .mb-right { height: 66px; right: 40px; gap: 16px; }
  #cover .mb-ico { width: 60px; height: 50px; } #cover .mb-ico svg { width: 33px; height: 33px; }
  #cover .notch { width: 450px; margin-left: -225px; height: 66px; border-radius: 0 0 26px 26px; }
  #cover .sd { height: 50px; font-size: 28px; padding: 0 18px; gap: 13px; background: rgba(255,255,255,.18); border-radius: 12px; }
  #cover .sd .dot { width: 20px; height: 20px; box-shadow: 0 0 26px 8px rgba(50, 215, 75, .55); }
  #cover .clock { font-size: 30px; }
  .c-title { position: absolute; left: 190px; top: 340px; font: 700 138px/1.2 var(--sans); letter-spacing: 0.01em; color: var(--text); }
  .c-title em { font-style: normal; color: var(--green); }
  .c-sub { position: absolute; left: 196px; top: 740px; font: 400 54px/1.3 var(--sans); color: var(--dim); }
  .c-sub b { color: var(--text); font-weight: 700; }
  .c-icon { position: absolute; right: 200px; top: 360px; }
  .c-icon .app-icon::after { box-shadow: 0 0 40px 10px rgba(50, 215, 75, .45); }
  .c-brand { position: absolute; right: 160px; top: 650px; width: 380px; text-align: center; font: 700 64px var(--sans); color: var(--text); }
</style>
</head>
<body>
<div id="cover"></div>
<script src="ui.js"></script>
<script>
  document.fonts.load('700 20px "SD Sans"', '字').then(() => document.fonts.load('400 20px "SD Sans"', '字')).then(() => {
    const cover = document.getElementById('cover');
    cover.style.setProperty('--grain', `url(${grainDataUrl()})`);
    new Backdrop(cover, 'mac').render(20, 1);
    const bar = new MenuBar(cover);
    bar.dot.style.background = COLORS.green;
    el('div', 'c-title', cover, '一个<em>圆点</em>，<br>管住本机所有服务');
    el('div', 'c-sub', cover, '产品经理 × Claude · <b>一行代码没写</b>');
    const ic = el('div', 'c-icon', cover);
    appIcon(ic, 280);
    el('div', 'c-brand', cover, 'ServiceDeck');
    window.coverReady = true;
  });
</script>
</body>
</html>
