[project]
name = "servicedeck"
version = "0.1.0"
description = "本机服务控制台：常驻菜单栏的 ServiceDeck.app"
requires-python = ">=3.12,<3.13"
dependencies = [
    "pywebview>=5",
    "pyyaml>=6",
    "pydantic>=2",
    "httpx>=0.27",
]

[project.scripts]
servicedeck = "servicedeck.cli:main"

[dependency-groups]
dev = [
    "brotli>=1.2.0",
    "fonttools>=4.66.0",
    "numpy>=2.5.3",
    "playwright>=1.63.0",
    "pytest>=8",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/servicedeck"]

[tool.pytest.ini_options]
testpaths = ["tests"]
markers = [
    "integration: 启动临时 process-compose 实例的集成测试（较慢）",
    "app: 启动 App 进程的行为测试（会出现菜单栏图标）",
]
